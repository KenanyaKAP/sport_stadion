<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Pesanan Saya — Sport Stadion</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/static/styles.css">
  <script src="/static/app.js"></script>
</head>
<body>
  <main class="container" style="max-width:820px; padding-bottom:60px">
    <h1 class="page-title">Pesanan Saya</h1>
    <div class="panel hidden" id="signed-in" style="display:flex; gap:10px; align-items:center; justify-content:space-between; flex-wrap:wrap">
      <div>Pesanan untuk <b id="signed-in-email"></b></div>
      <button class="btn btn-outline btn-sm" id="refresh">Muat ulang</button>
    </div>
    <div class="panel hidden" id="signed-out">
      <h3 style="font-size:22px; margin-bottom:6px">Masuk untuk melihat pesanan</h3>
      <p class="muted" style="margin:0 0 14px">Pakai email yang sama dengan di Conversify atau saat checkout. Dari halaman pesanan kamu bisa mensimulasikan pembayaran.</p>
      <button class="btn btn-primary" id="sign-in">Masuk dengan email</button>
    </div>
    <div id="list" style="margin-top:16px"></div>
  </main>

<script>
const STATUS_LABEL = { pending_payment: "Menunggu Pembayaran", paid: "Dibayar", shipped: "Dikirim", delivered: "Diterima", cancelled: "Dibatalkan" };

async function search(email) {
  const list = document.getElementById("list");
  list.innerHTML = `<div class="skeleton" style="height:120px"></div>`;
  try {
    const orders = await API.get(`/orders?email=${encodeURIComponent(email)}`);
    list.innerHTML = orders.length ? orders.map((o) => `
      <a class="panel" style="display:flex; gap:16px; align-items:center; flex-wrap:wrap" href="/order/${o.order_number}?email=${encodeURIComponent(email)}">
        <div style="display:flex">${o.items.slice(0, 3).map((it) => `<div style="width:56px;height:56px;border-radius:10px;overflow:hidden;margin-right:-10px;border:2px solid #fff">${productArt(it.icon, it.color_hex)}</div>`).join("")}</div>
        <div style="flex:1; min-width:180px; margin-left:12px">
          <div style="font-family:ui-monospace,monospace; font-weight:600">${esc(o.order_number)}</div>
          <div class="muted" style="font-size:13px">${new Date(o.created_at).toLocaleDateString("id-ID", { dateStyle: "medium" })} · ${o.items.reduce((n, i) => n + i.quantity, 0)} barang</div>
        </div>
        <span class="status ${o.status}">${STATUS_LABEL[o.status]}</span>
        <div style="font-weight:700; min-width:110px; text-align:right">${rupiah(o.total)}</div>
      </a>`).join("") : `<div class="panel empty"><h3>Belum ada pesanan</h3><p>Tidak ada pesanan untuk email ini.</p></div>`;
  } catch (e) {
    list.innerHTML = `<div class="panel msg err">${esc(e.message)}</div>`;
  }
}

document.addEventListener("DOMContentLoaded", () => {
  const email = Account.email();
  if (email) {
    document.getElementById("signed-in").classList.remove("hidden");
    document.getElementById("signed-in-email").textContent = email;
    document.getElementById("refresh").onclick = () => search(email);
    search(email);
  } else {
    document.getElementById("signed-out").classList.remove("hidden");
    document.getElementById("sign-in").onclick = () => openAccountDialog();
  }
});
</script>
</body>
</html>
